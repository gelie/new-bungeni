<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bungeni</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --parliament-green: #006838;
            --parliament-gold: #FFB81C;
        }
        
        .bg-parliament-green {
            background-color: var(--parliament-green);
        }
        
        .text-parliament-gold {
            color: var(--parliament-gold);
        }
    </style>
</head>
<body class="bg-base-200">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="card w-full max-w-md bg-base-100 shadow-2xl">
            <div class="card-body">
                <!-- Logo and Title -->
                <div class="text-center mb-6">
                    <div class="bg-parliament-green text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="landmark" class="w-8 h-8"></i>
                    </div>
                    <h1 class="text-3xl font-bold">BUNGENI</h1>
                    <p class="text-base-content/70 mt-2">Parliamentary Workflow System</p>
                </div>

                <!-- Messages -->
                {% if messages %}
                    <div class="space-y-2 mb-4">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <!-- Login Form -->
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Username</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                <i data-lucide="user" class="w-5 h-5 text-base-content/50"></i>
                            </span>
                            <input type="text" name="username" placeholder="Enter your username" 
                                   class="input input-bordered w-full pl-10" required autofocus>
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Password</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                <i data-lucide="lock" class="w-5 h-5 text-base-content/50"></i>
                            </span>
                            <input type="password" name="password" placeholder="Enter your password" 
                                   class="input input-bordered w-full pl-10" required>
                        </div>
                        <label class="label">
                            <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
                        </label>
                    </div>

                    <div class="form-control mt-6">
                        <button type="submit" class="btn bg-parliament-green hover:bg-parliament-green/90 text-white border-0">
                            <i data-lucide="log-in" class="w-5 h-5 mr-2"></i>
                            Sign In
                        </button>
                    </div>
                </form>

                <div class="divider">OR</div>

                <div class="text-center text-sm text-base-content/70">
                    <p>For demo purposes, use:</p>
                    <p class="font-mono text-xs mt-1">admin / admin</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
