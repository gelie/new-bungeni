{% if groups %}
{% for group in groups %}
<div class="px-4 py-3 hover:bg-base-200 cursor-pointer border-b border-base-200 last:border-b-0 transition-colors"
  onclick="selectGroup('{{ group.id }}', '{{ group.name }}')">
  <div class="flex items-center justify-between">
    <div>
      <div class="font-medium">{{ group.name }}</div>
      <div class="text-sm opacity-70">{{ group.members.count }} members</div>
    </div>
  </div>
</div>
{% endfor %}
{% else %}
<div class="px-4 py-3 text-center opacity-70">
  No groups found matching your search
</div>
{% endif %}
