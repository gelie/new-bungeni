{% if users %}
  {% for user in users %}
    <div class="px-4 py-3 hover:bg-base-200 cursor-pointer border-b border-base-200 last:border-b-0 transition-colors"
         onclick="selectUser('{{ user.id }}', '{{ user.username }}', '{{ user.first_name }} {{ user.last_name }}', {{ user.is_mp|yesno:'true,false' }})">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium">
            {% if user.is_mp == True %}
              <span class="badge badge-primary badge-sm">MP</span>
            {% else %}
              <span class="badge badge-ghost badge-sm">Staff</span>
            {% endif %}
            {{ user.first_name }} {{ user.last_name }}
          </div>
          <div class="text-sm opacity-70">@{{ user.username }}</div>
        </div>
        {% comment %} <div class="text-sm opacity-50">
      ID: {{ user.id }}
        </div> {% endcomment %}
      </div>
    </div>
  {% endfor %}
{% else %}
  <div class="px-4 py-3 text-center opacity-70">No users found matching your search</div>
{% endif %}
